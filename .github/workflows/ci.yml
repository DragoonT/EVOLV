name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  lint:
    name: format / vet / docs
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Resolve the source version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^var Version = "\([0-9][0-9.]*\)"$/\1/p' internal/workspace/workspace.go | head -1)"
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "packaging v${version}"

      - name: gofmt
        timeout-minutes: 5
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod / go.sum are tidy
        timeout-minutes: 5
        run: go mod tidy -diff

      - name: go vet
        timeout-minutes: 8
        run: go vet ./...

      - name: Generated docs are current
        timeout-minutes: 5
        run: |
          set -euo pipefail
          go run ./cmd/evolv-docs
          if ! git diff --exit-code -- docs/index.html; then
            echo "::error::docs/index.html is stale; run: go run ./cmd/evolv-docs"
            exit 1
          fi

      - name: Diagnostics on failure
        if: failure()
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED GOCACHE GOMODCACHE
          git status --short

  test:
    name: test / coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Test
        timeout-minutes: 15
        run: go test ./... -count=1 -shuffle=on -timeout=10m -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Coverage gate (>= 50%)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')"
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 >= 50) ? 0 : 1 }' || {
            echo "::error::coverage ${total}% is below the 50% floor"
            exit 1
          }

      - name: Fuzz seed corpus
        run: go test ./internal/agent -run FuzzExtractProtocol -count=1

      - name: Build
        timeout-minutes: 10
        run: go build ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          if-no-files-found: warn

      - name: Diagnostics on failure
        if: failure()
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED GOCACHE GOMODCACHE
          git status --short

  platform:
    name: platform unit / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Pure package tests
        timeout-minutes: 15
        run: go test ./internal/workspace ./internal/redact ./internal/docsgen ./internal/providers -count=1 -timeout=10m

      - name: Diagnostics on failure
        if: failure()
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED GOCACHE GOMODCACHE
          git status --short

  smoke:
    name: boot / api smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Build binary
        timeout-minutes: 5
        run: |
          set -euo pipefail
          version="$(sed -n 's/^var Version = "\([0-9][0-9.]*\)"$/\1/p' internal/workspace/workspace.go | head -1)"
          go build -trimpath \
            -ldflags="-s -w -X github.com/dxn111/EVOLV/internal/workspace.Version=${version}" \
            -o /tmp/evolv-smoke ./cmd/evolv

      - name: Boot, probe, pack and drain
        timeout-minutes: 8
        run: bash scripts/smoke.sh /tmp/evolv-smoke 17391

      - name: Server log on failure
        if: failure()
        run: find /tmp -maxdepth 2 -name 'evolv-smoke.log' -exec cat {} \; || true

  race:
    name: race detector
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Race test (whole module)
        timeout-minutes: 20
        run: go test -race ./... -count=1 -timeout=15m

      - name: Diagnostics on failure
        if: failure()
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED GOCACHE GOMODCACHE
          git status --short

  package:
    name: package / release dry-run
    needs: lint
    uses: ./.github/workflows/_package.yml
    with:
      version: ${{ needs.lint.outputs.version }}

  workflow-lint:
    name: workflow / shell syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Validate YAML
        timeout-minutes: 2
        run: |
          ruby -e '
            require "yaml"
            files = Dir[".github/**/*.{yml,yaml}"]
            abort "no workflow files found" if files.empty?
            files.sort.each do |f|
              YAML.load_file(f)
              puts "ok #{f}"
            end
          '

      - name: Audit workflow metadata
        timeout-minutes: 2
        run: ruby .github/scripts/audit_workflows.rb

      - name: actionlint
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12; then
              break
            fi
            echo "actionlint install failed (attempt ${attempt}); retrying"
            sleep 5
          done
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Shellcheck the release scripts
        timeout-minutes: 3
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n scripts/smoke.sh
          bash -n scripts/verify-artifacts.sh
          shellcheck -S warning scripts/smoke.sh scripts/verify-artifacts.sh
