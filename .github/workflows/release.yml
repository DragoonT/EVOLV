name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.33.0 (must match internal/workspace.Version)"
        required: true
        type: string
      dry_run:
        description: "Build and verify every artifact, but do not publish a release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  validate:
    name: validate / v${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Resolve and validate the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          raw="${INPUT_VERSION}"
          if [ -z "$raw" ]; then
            raw="$REF_NAME"
          fi
          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::invalid release version: ${raw} (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "v${version}" ]; then
            echo "::error::tag ${REF_NAME} does not match version v${version}"
            exit 1
          fi
          source_version="$(sed -n 's/^var Version = "\([0-9][0-9.]*\)"$/\1/p' internal/workspace/workspace.go | head -1)"
          if [ "$source_version" != "$version" ]; then
            echo "::error::internal/workspace.Version is ${source_version}, but the release is ${version}; bump the source before tagging"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "releasing v${version} from ${GITHUB_SHA}"

      - name: Test
        timeout-minutes: 15
        run: go test ./... -count=1 -shuffle=on -timeout=10m

      - name: Vet and build
        timeout-minutes: 10
        run: |
          go vet ./...
          go build ./...

      - name: Generated docs are current
        timeout-minutes: 5
        run: |
          go run ./cmd/evolv-docs
          git diff --exit-code -- docs/index.html

      - name: Diagnostics on failure
        if: failure()
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED GOCACHE GOMODCACHE
          git status --short

  package:
    name: package / verified artifacts
    needs: validate
    uses: ./.github/workflows/_package.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    name: publish
    needs: [validate, package]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download the verified distribution
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: Generate SBOM
        timeout-minutes: 10
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/evolv.spdx.json
          upload-artifact: false

      - name: Checksums over the complete release set
        timeout-minutes: 3
        run: |
          set -euo pipefail
          cd dist
          sha256sum evolv_* evolv.spdx.json > checksums.txt
          sha256sum -c checksums.txt
          grep -q ' evolv_linux_amd64$' checksums.txt
          grep -q ' evolv_darwin_arm64$' checksums.txt
          grep -q ' evolv_windows_amd64.exe$' checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/evolv_*
            dist/checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/evolv_*
            dist/evolv.spdx.json
            dist/checksums.txt

      - name: Diagnostics on failure
        if: failure()
        run: |
          ls -lhR dist || true
          find dist -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true
