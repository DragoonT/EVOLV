<style>#c-heartbeat .hb{display:flex;align-items:baseline;gap:10px;justify-content:center;padding:6px 0}#c-heartbeat .time{font:800 40px/1 ui-monospace,monospace;background:linear-gradient(135deg,#8b5cf6,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}#c-heartbeat .ampm{font-size:11px;color:#8b93ab;letter-spacing:2px}#c-heartbeat .date{text-align:center;color:#8b93ab;font-size:11.5px;margin-top:4px;letter-spacing:1px}#c-heartbeat .pulse{width:8px;height:8px;border-radius:50%;background:#a3e635;box-shadow:0 0 10px #a3e635;animation:hbPulse 2s ease infinite;display:inline-block;margin-right:6px}@keyframes hbPulse{50%{opacity:.3;transform:scale(.8)}}</style>
<div id="c-heartbeat">
  <div class="hb"><span class="pulse"></span><span class="time" id="hb-time">--:--</span><span class="ampm" id="hb-ampm"></span></div>
  <div class="date" id="hb-date"></div>
</div>
<script>(function(){function tick(){var d=new Date(),h=d.getHours(),m=d.getMinutes();var am=h>=12?'PM':'AM';h=h%12;if(h===0)h=12;var t=document.getElementById('hb-time');if(!t)return;t.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');var a=document.getElementById('hb-ampm');if(a)a.textContent=am;var dd=document.getElementById('hb-date');if(dd)dd.textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}tick();setInterval(tick,1000)})();</script>
