<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="textgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="1200" height="300" fill="#05060a"/>
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- neural links -->
  <g stroke="#6366f1" stroke-opacity="0.16" stroke-width="1">
    <line x1="90" y1="60" x2="260" y2="130"/><line x1="260" y1="130" x2="170" y2="240"/>
    <line x1="950" y1="70" x2="1100" y2="150"/><line x1="1100" y1="150" x2="1000" y2="250"/>
    <line x1="950" y1="70" x2="1020" y2="40"/><line x1="1050" y1="60" x2="1100" y2="150"/>
    <line x1="90" y1="60" x2="40" y2="140"/>
  </g>
  <g fill="#8b5cf6">
    <circle cx="90" cy="60" r="3.4"/><circle cx="260" cy="130" r="2.6"/><circle cx="170" cy="240" r="3"/>
    <circle cx="950" cy="70" r="3.2"/><circle cx="1100" cy="150" r="2.8"/><circle cx="1000" cy="250" r="3.1"/>
    <circle cx="40" cy="140" r="2.4"/><circle cx="1020" cy="40" r="2.2"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.9">
    <circle cx="115" cy="52" r="1.8"/><circle cx="235" cy="118" r="1.6"/><circle cx="1075" cy="120" r="1.7"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="158" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="96" letter-spacing="14" fill="url(#textgrad)">EVOLV</text>
  <text x="600" y="158" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="96" letter-spacing="14" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">EVOLV</text>

  <!-- tagline -->
  <text x="600" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="24" fill="#e8ecf8">the workspace that rewrites itself</text>

  <!-- sub -->
  <text x="600" y="248" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-weight="400" font-size="15" fill="#8b93ab">it grows its own UI · tools · skills · prompts — live, while you watch</text>

  <!-- accent underline -->
  <rect x="470" y="172" width="260" height="4" rx="2" fill="url(#g1)" filter="url(#soft)"/>
</svg>
